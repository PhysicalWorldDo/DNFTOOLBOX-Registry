name: Sync toolbox release registry
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registry-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated registry environment
        run: python -m venv .venv
      - name: Verify released packages and append versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/toolbox_release.py sync --root .
      - name: Commit registry changes
        run: |
          if [ -z "$(git status --porcelain -- index.json tools/dnf_skill_prism.json tools/rep_player.json tools/neople_video_player.json)" ]; then
            echo 'No new tool releases'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.json tools/dnf_skill_prism.json tools/rep_player.json tools/neople_video_player.json
          git diff --cached --check
          git commit -m 'Sync published tool versions'
          git pull --rebase origin main
          git push origin HEAD:main
